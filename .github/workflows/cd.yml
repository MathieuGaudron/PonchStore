name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  publish:
    name: Publier les images de production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      proprietaire: ${{ steps.proprietaire.outputs.nom }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Docker impose des noms de dépôt entièrement en minuscules, alors qu'un
      # propriétaire GitHub peut contenir des majuscules (MathieuGaudron). Sans
      # cette normalisation, la publication échoue sur "repository name must be
      # lowercase". Le résultat est exposé en sortie de job pour que le
      # déploiement vise exactement les mêmes images.
      - name: Normalisation du propriétaire en minuscules
        id: proprietaire
        run: echo "nom=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Vérification de l'URL de l'API
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: test -n "$VITE_API_BASE_URL"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publication de l'image API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.proprietaire.outputs.nom }}/ponchstore-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Publication de l'image front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: ${{ env.REGISTRY }}/${{ steps.proprietaire.outputs.nom }}/ponchstore-front:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=front-prod
          cache-to: type=gha,mode=max,scope=front-prod

  deploy:
    name: Déployer sur le VPS
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_OWNER: ${{ needs.publish.outputs.proprietaire }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_PATH,GHCR_TOKEN,GHCR_USER,GHCR_OWNER,IMAGE_TAG
          script: |
            set -eu
            cd "$VPS_APP_PATH"
            git pull --ff-only origin main

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            # Le tag de l'image est persisté dans .env.deploy plutôt que simplement
            # exporté : sans lui, toute commande docker compose lancée à la main sur
            # le VPS ensuite (logs, ps, restart) ne saurait plus quelle image viser.
            printf 'GHCR_OWNER=%s\nIMAGE_TAG=%s\n' "$GHCR_OWNER" "$IMAGE_TAG" > .env.deploy

            compose() {
              docker compose --env-file .env.prod --env-file .env.deploy \
                -f docker-compose.prod.yml "$@"
            }

            compose pull
            compose up -d --remove-orphans

            # --user www-data est indispensable : lancées en root, ces commandes
            # créent var/cache/prod en root et Apache, qui tourne en www-data, ne
            # peut plus y écrire — toutes les requêtes suivantes renvoient 500.
            compose exec -T --user www-data api php bin/console doctrine:migrations:migrate --no-interaction

            # Sert aussi de test de fumée : le warmup compile le conteneur Symfony
            # avec les vraies variables d'environnement, donc il échoue bruyamment
            # si une variable manque ou si la configuration est invalide.
            compose exec -T --user www-data api php bin/console cache:warmup

            docker image prune -f

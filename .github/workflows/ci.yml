name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API — tests PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ponchstore_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Doctrine ajoute le suffixe _test en environnement de test : la base visée
      # est donc ponchstore_test, celle créée par le service ci-dessus.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/ponchstore?serverVersion=8.0&charset=utf8mb4"

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, ctype, iconv
          coverage: none

      - name: Préparation des variables d'environnement
        working-directory: api
        run: cp .env.example .env

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Installation des dépendances
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      # Échoue dès qu'une dépendance PHP fait l'objet d'un avis de sécurité.
      # Placé avant les tests : inutile de valider le comportement d'un code
      # qu'on sait vulnérable.
      - name: Audit de sécurité des dépendances (composer audit)
        working-directory: api
        run: composer audit

      - name: Analyse syntaxique (php -l)
        working-directory: api
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Migrations sur la base de test
        working-directory: api
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Tests unitaires et fonctionnels
        working-directory: api
        run: php bin/phpunit --testdox

  front:
    name: Front — lint et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        working-directory: front
        run: npm ci

      # Seuil à "high" : l'écosystème npm signale en permanence des avis
      # mineurs sur des outils de développement qui ne sont jamais livrés au
      # navigateur. Bloquer là-dessus rendrait la CI rouge en continu et on
      # finirait par ignorer le signal.
      - name: Audit de sécurité des dépendances (npm audit)
        working-directory: front
        run: npm audit --audit-level=high

      - name: Lint (ESLint)
        working-directory: front
        run: npm run lint

      - name: Build de production (Vite)
        working-directory: front
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Préparation des variables d'environnement
        run: cp .env.example .env

      - name: Build des images
        run: docker compose build

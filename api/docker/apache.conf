<VirtualHost *:80>
    DocumentRoot /var/www/api/public

    # Apache ne transmet pas l'en-tête Authorization à PHP. Sans cette ligne, le
    # navigateur envoie bien « Authorization: Bearer ... » mais Symfony ne le voit
    # jamais : toute requête authentifiée répond « JWT Token not found », alors que
    # la connexion, elle, fonctionne. Invisible en développement, où le serveur
    # intégré de PHP transmet l'en-tête sans configuration.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/api/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

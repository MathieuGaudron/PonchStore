services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/${GHCR_OWNER}/ponchstore-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/ponchstore-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    command: php bin/console messenger:consume scheduler_creneaux --no-interaction
    # Le planificateur est déclaré stateful() : il mémorise sa dernière exécution
    # dans le pool de cache, sous var/share. Sans volume, cet état repart de zéro
    # à chaque déploiement, puisque le conteneur est recréé.
    volumes:
      - scheduler_state:/var/www/api/var/share

  mailer:
    image: ghcr.io/${GHCR_OWNER}/ponchstore-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    command: php bin/console messenger:consume async --no-interaction

  front:
    image: ghcr.io/${GHCR_OWNER}/ponchstore-front:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - front
      - api
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
  scheduler_state:

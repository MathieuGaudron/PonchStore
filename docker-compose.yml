services:
  db:
    image: mysql:8.0
    container_name: ponchstore-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: ponchstore-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/var/www/api
    ports:
      - "8080:8000"
    command: sh -c "composer install --no-interaction --no-progress && php -S 0.0.0.0:8000 -t public"

  scheduler:
    build: ./api
    container_name: ponchstore-scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/var/www/api
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php bin/console messenger:consume scheduler_creneaux --no-interaction"

  mailer:
    build: ./api
    container_name: ponchstore-mailer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/var/www/api
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php bin/console messenger:consume async --no-interaction --time-limit=3600"

  mailhog:
    image: mailhog/mailhog
    container_name: ponchstore-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"

  front:
    build: ./front
    container_name: ponchstore-front
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./front:/app
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
